<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Warenkorb — Mein Webshop</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="site-header container">
            <h1 class="logo">Warenkorb</h1>
            <nav>
                <a href="index.html">Start</a>
                <a href="products.html">Produkte</a>
                <a href="contact.html">Kontakt</a>
                <a href="cart.html" aria-current="page">Warenkorb</a>
            </nav>
        </header>

        <main class="container">
            <section>
                <h2>Ihre Bestellung</h2>
                <div id="cart-items"></div>
                <div id="cart-summary"></div>

                <h3>Bestellformular</h3>
                <form id="checkout-form">
                    <label for="fullname">Vollständiger Name</label>
                    <input id="fullname" name="fullname" required />

                    <label for="address">Adresse</label>
                    <input id="address" name="address" required />

                    <label for="email">E-Mail</label>
                    <input id="email" name="email" type="email" required />

                    <button type="submit">Bestellung absenden</button>
                </form>
                <p id="checkout-msg" class="muted"></p>
            </section>
        </main>

        <footer class="site-footer container">
            <p>&copy; 2026 Mein Webshop</p>
        </footer>

        <script src="js/cart.js"></script>
    </body>
</html>
