<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sneaker Run — Mein Webshop</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="site-header container">
            <h1 class="logo">Sneaker Run</h1>
            <nav>
                <a href="Index.html">Start</a>
                <a href="products.html">Produkte</a>
                <a href="contact.html">Kontakt</a>
                <a href="cart.html"
                    >Warenkorb (<span id="cart-count">0</span>)</a
                >
            </nav>
        </header>

        <main class="container product-detail">
            <article>
                <h2>Sneaker Run</h2>
                <div class="detail-grid">
                    <div class="media-text">
                        <img
                            src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fgraziamagazine.com%2Fus%2Fwp-content%2Fuploads%2Fsites%2F15%2F2025%2F03%2Fsneaker-trends-2025-retro-revivals-bold-styles-8-1024x1024.jpg&f=1&nofb=1&ipt=9a54d62a92ebdcba2f35c1998305c134806ff0b04af7903418b35809618c5650"
                            alt="Sneaker Run"
                        />
                        <video
                            controls
                            class="product-video"
                            src="./BestVideo.mp4"
                        >
                            Ihr Browser unterstützt kein Video.
                        </video>
                    </div>
                    <div class="meta">
                        <p class="price">€89.99</p>
                        <p>Bequeme Sneaker für Alltag und Sport.</p>
                        <form
                            onsubmit="
                                orderProduct('p4', 'Sneaker Run', this);
                                return false;
                            "
                        >
                            <label for="qty-p4">Menge</label>
                            <input
                                id="qty-p4"
                                name="qty"
                                type="number"
                                value="1"
                                min="1"
                            />
                            <label for="name-p4">Name</label>
                            <input id="name-p4" name="name" required />
                            <label for="email-p4">E-Mail</label>
                            <input
                                id="email-p4"
                                name="email"
                                type="email"
                                required
                            />
                            <button type="submit">Jetzt bestellen</button>
                        </form>
                        <button
                            onclick="
                                addToCart('p4');
                                updateCartCount();
                                alert('Produkt zum Warenkorb hinzugefügt');
                            "
                        >
                            In den Warenkorb
                        </button>
                    </div>
                </div>
            </article>
        </main>

        <footer class="site-footer container">
            <p>&copy; 2026 Mein Webshop</p>
        </footer>

        <script src="js/cart.js"></script>
    </body>
</html>
